[package]
name = "gui-connect"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
fast_image_resize = "6.2"
flate2 = "1"
futures-util = "0.3"
rpassword = "7"
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
vnc = { package = "vnc-rs", version = "0.6.1" }
x11rb = { version = "0.13", features = ["xtest"] }
x11rb-protocol = "0.13"
