[package]
name = "terminal-vnc-kitty"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream"] }
flate2 = "1"
futures-util = "0.3"
rpassword = "7"
tokio = { version = "1", features = ["macros", "net", "rt", "time"] }
vnc = { package = "vnc-rs", version = "0.6.1" }
